<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoria · 长记忆 AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0b0a;--bg2:#111010;--surface:#1a1917;--surface2:#212019;
  --surfaceH:#2a2927;--border:#2e2d2b;--border2:#3a3937;
  --accent:#c8956c;--accentSoft:rgba(200,149,108,.12);--accentH:#d9a87e;
  --text:#eae4dc;--text2:#9a9490;--textM:#5c5856;
  --userBg:#172530;--userBd:#253540;
  --aiBg:#1a1917;--aiBd:#2a2927;
  --proBg:#231a28;--proBd:#35283d;
  --ok:#7aad7a;--err:#c06050;--warn:#c0a050;
  --ff:'Noto Serif SC',Georgia,serif;
  --fb:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --fm:'JetBrains Mono','Menlo',monospace;
  --r:12px;--rs:8px;
}
html{font-size:15px;-webkit-font-smoothing:antialiased}
body{font-family:var(--fb);background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
textarea{font-family:var(--fb);border:none;outline:none;background:none;color:inherit;resize:none}
input{font-family:var(--fm)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

#app{display:flex;flex-direction:column;height:100dvh;max-width:860px;margin:0 auto}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);flex-shrink:0}
.hdrL{display:flex;align-items:baseline;gap:10px}
.logo{font-family:var(--ff);font-size:1.35rem;font-weight:600;color:var(--accent)}
.sub{font-size:.72rem;color:var(--textM);letter-spacing:.08em;text-transform:uppercase}
.hdrR{display:flex;gap:6px}
.ib{width:36px;height:36px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;transition:all .2s;color:var(--text2)}
.ib:hover{background:var(--surfaceH);color:var(--text)}
.ib.on{background:var(--accentSoft);color:var(--accent)}
.ib svg{width:18px;height:18px;pointer-events:none}

/* Chat */
.chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 24px;scroll-behavior:smooth}
.chatIn{padding:24px 0;min-height:100%;display:flex;flex-direction:column}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:40vh;text-align:center;gap:12px;opacity:0;animation:fu .6s ease .1s forwards}
.welcome h2{font-family:var(--ff);font-size:1.8rem;font-weight:300}
.welcome p{color:var(--text2);font-size:.9rem;max-width:400px;line-height:1.7}
.welcome .hint{color:var(--textM);font-size:.8rem;margin-top:8px}
.welcome .aline{width:40px;height:2px;background:var(--accent);border-radius:1px;margin:4px 0}

.msg{display:flex;gap:10px;margin-bottom:20px;opacity:0;animation:fu .3s ease forwards}
.msg.user{flex-direction:row-reverse}
.msgC{max-width:78%;display:flex;flex-direction:column;gap:4px}
.msg.user .msgC{align-items:flex-end}
.bub{padding:10px 14px;border-radius:var(--r);line-height:1.7;font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.msg.user .bub{background:var(--userBg);border:1px solid(--userBd);border-bottom-right-radius:4px}
.msg.ai .bub{background:var(--aiBg);border:1px solid(--aiBd);border-bottom-left-radius:4px}
.msg.pro .bub{background:var(--proBg);border:1px solid(--proBd);border-bottom-left-radius:4px}
.meta{font-size:.7rem;color:var(--textM);padding:0 4px;display:flex;align-items:center;gap:6px}
.msg.user .meta{flex-direction:row-reverse}
.tag{font-size:.6rem;padding:1px 6px;border-radius:3px;background:var(--accentSoft);color:var(--accent)}

.typing{display:flex;gap:5px;padding:8px 4px}
.typing span{width:6px;height:6px;background:var(--textM);border-radius:50%;animation:bnc 1.4s ease infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

/* Input */
.inArea{flex-shrink:0;padding:12px 24px 20px;border-top:1px solid var(--border);background:var(--bg)}
.inWrap{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px 8px 8px 16px;transition:border-color .2s}
.inWrap:focus-within{border-color:var(--accent)}
.inWrap textarea{flex:1;font-size:.9rem;line-height:1.6;max-height:150px;padding:4px 0}
.inWrap textarea::placeholder{color:var(--textM)}
.sBtn{width:36px;height:36px;border-radius:var(--rs);background:var(--accent);display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.sBtn:hover{background:var(--accentH);transform:scale(1.05)}
.sBtn:disabled{opacity:.35;cursor:default;transform:none}
.sBtn svg{width:16px;height:16px;fill:none;stroke:var(--bg);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.inFoot{display:flex;justify-content:space-between;padding:8px 4px 0;font-size:.7rem;color:var(--textM)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
.dot.on{background:var(--ok)}.dot.off{background:var(--textM)}

/* Overlay */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none}
.ov.show{display:block}

/* Panel */
.pnl{position:fixed;top:0;right:0;bottom:0;width:min(420px,90vw);background:var(--bg2);border-left:1px solid var(--border);z-index:100;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto}
.pnl.show{transform:translateX(0)}
.pnlH{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);flex-shrink:0}
.pnlH h3{font-family:var(--ff);font-size:1.1rem;font-weight:400}
.xb{width:32px;height:32px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .2s}
.xb:hover{background:var(--surfaceH);color:var(--text)}
.pnlB{flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:24px}

.st{font-size:.75rem;color:var(--textM);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.st::after{content:'';flex:1;height:1px;background:var(--border)}

.pCard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.pf{display:flex;flex-direction:column;gap:3px}
.pl{font-size:.7rem;color:var(--textM);text-transform:uppercase;letter-spacing:.05em}
.pv{font-size:.85rem;color:var(--text);line-height:1.5}
.pv.empty{color:var(--textM);font-style:italic;font-size:.8rem}
.ptags{display:flex;flex-wrap:wrap;gap:5px}
.ptag{font-size:.75rem;padding:3px 10px;border-radius:20px;background:var(--accentSoft);color:var(--accent);border:1px solid rgba(200,149,108,.2)}

.sList{display:flex;flex-direction:column;gap:10px}
.sItem{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;transition:all .2s}
.sItem:hover{border-color:var(--border2);background:var(--surfaceH)}
.sDate{font-size:.7rem;color:var(--textM);margin-bottom:6px;font-family:var(--fm)}
.sText{font-size:.82rem;color:var(--text2);line-height:1.6}
.sTopics{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.sTopic{font-size:.65rem;padding:2px 8px;border-radius:10px;background:var(--surface2);color:var(--textM);border:1px solid var(--border)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statC{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:12px;text-align:center}
.statN{font-family:var(--fm);font-size:1.4rem;color:var(--accent)}
.statL{font-size:.7rem;color:var(--textM);margin-top:2px}

.pnlBtns{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.btnO{padding:10px;border:1px solid var(--border);border-radius:var(--rs);font-size:.82rem;color:var(--text2);transition:all .2s;text-align:center;cursor:pointer}
.btnO:hover{border-color:var(--accent);color:var(--accent);background:var(--accentSoft)}
.btnO.dng:hover{border-color:var(--err);color:var(--err);background:rgba(192,96,80,.1)}

/* Modal */
.modal{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modalBg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.modalBox{position:relative;background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:min(480px,92vw);max-height:85vh;overflow-y:auto;z-index:1;transform:scale(.95);transition:transform .2s ease}
.modal.show .modalBox{transform:scale(1)}
.mH{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
.mH h3{font-family:var(--ff);font-size:1.1rem;font-weight:400}
.mB{padding:20px 24px 24px;display:flex;flex-direction:column;gap:18px}
.fg{display:flex;flex-direction:column;gap:6px}
.fl{font-size:.78rem;color:var(--text2)}
.fi{padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:.85rem;transition:border-color .2s}
.fi:focus{border-color:var(--accent);outline:none}
.fi::placeholder{color:var(--textM)}
.fRow{display:flex;gap:12px}.fRow .fg{flex:1}

.tgl{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs)}
.tglL{font-size:.85rem}
.tglB{width:42px;height:24px;background:var(--border);border-radius:12px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.tglB.on{background:var(--accent)}
.tglB::after{content:'';position:absolute;width:18px;height:18px;background:var(--text);border-radius:50%;top:3px;left:3px;transition:transform .2s}
.tglB.on::after{transform:translateX(18px)}

.tRes{font-size:.78rem;padding:8px 12px;border-radius:var(--rs)}
.tRes.ok{background:rgba(122,173,122,.1);color:var(--ok);border:1px solid rgba(122,173,122,.2)}
.tRes.er{background:rgba(192,96,80,.1);color:var(--err);border:1px solid rgba(192,96,80,.2)}

.mA{display:flex;gap:10px;padding-top:8px}
.btnP{flex:1;padding:11px;background:var(--accent);color:var(--bg);border-radius:var(--rs);font-size:.85rem;font-weight:500;transition:all .2s;text-align:center}
.btnP:hover{background:var(--accentH)}
.btnS{padding:11px 20px;border:1px solid var(--border);color:var(--text2);border-radius:var(--rs);font-size:.85rem;transition:all .2s}
.btnS:hover{border-color:var(--border2);color:var(--text)}

.sumInd{display:flex;align-items:center;gap:8px;padding:8px 14px;color:var(--textM);font-size:.8rem}
.sumInd .d span{animation:blink 1.4s infinite}
.sumInd .d span:nth-child(2){animation-delay:.2s}
.sumInd .d span:nth-child(3){animation-delay:.4s}

@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes bnc{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--err);color:white;padding:10px 20px;border-radius:8px;font-size:.85rem;z-index:200;animation:fu .3s ease}

@media(max-width:600px){
  .hdr{padding:12px 16px}.chat{padding:0 12px}.inArea{padding:10px 12px 16px}
  .bub{font-size:.85rem}.welcome h2{font-size:1.4rem}
}
</style>
</head>
<body>
<div id="app">

  <header class="hdr">
    <div class="hdrL">
      <h1 class="logo">Memoria</h1>
      <span class="sub">长记忆 AI</span>
    </div>
    <div class="hdrR">
      <button class="ib" data-action="open-memory" title="记忆面板">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/><path d="M9 21h6"/><path d="M10 17v4"/><path d="M14 17v4"/></svg>
      </button>
      <button class="ib" data-action="open-settings" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </header>

  <main class="chat" id="chat">
    <div class="chatIn" id="chatIn">
      <div class="welcome" id="welcome">
        <h2>你好，我是 Memoria</h2>
        <div class="aline"></div>
        <p>一个有长期记忆的 AI 伙伴。我会记住我们的每一次对话，越来越了解你。</p>
        <p class="hint">点击右上角齿轮配置 API，然后开始聊天。</p>
      </div>
    </div>
  </main>

  <div class="inArea">
    <div class="inWrap">
      <textarea id="inp" placeholder="说点什么..." rows="1"></textarea>
      <button class="sBtn" id="send" disabled>
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="inFoot">
      <span id="mSt"><span class="dot off"></span>记忆: 空</span>
      <span id="pSt"><span class="dot off"></span>主动消息: 关闭</span>
    </div>
  </div>

  <!-- Memory Panel -->
  <div class="ov" id="memOv"></div>
  <aside class="pnl" id="memPnl">
    <div class="pnlH">
      <h3>记忆面板</h3>
      <button class="xb" data-action="close-memory">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="pnlB" id="memBody"></div>
  </aside>

  <!-- Settings Modal -->
  <div class="modal" id="setModal">
    <div class="modalBg" data-action="close-settings"></div>
    <div class="modalBox">
      <div class="mH">
        <h3>设置</h3>
        <button class="xb" data-action="close-settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="mB">
        <div class="fg">
          <label class="fl">API 地址</label>
          <input class="fi" id="sUrl" placeholder="https://api.openai.com/v1/chat/completions">
        </div>
        <div class="fg">
          <label class="fl">API Key</label>
          <input class="fi" id="sKey" type="password" placeholder="sk-...">
        </div>
        <div class="fRow">
          <div class="fg">
            <label class="fl">模型名称</label>
            <input class="fi" id="sModel" placeholder="gpt-4o-mini">
          </div>
          <div class="fg">
            <label class="fl">上下文消息数</label>
            <input class="fi" id="sCtx" type="number" min="4" max="50" value="12">
          </div>
        </div>
        <div class="tgl">
          <span class="tglL">启用主动消息</span>
          <div class="tglB" id="tglPro" data-action="toggle-proactive"></div>
        </div>
        <div class="fRow">
          <div class="fg">
            <label class="fl">主动消息间隔 (分钟)</label>
            <input class="fi" id="sInt" type="number" min="5" max="1440" value="30">
          </div>
          <div class="fg">
            <label class="fl">自动摘要阈值 (条)</label>
            <input class="fi" id="sThr" type="number" min="6" max="100" value="16">
          </div>
        </div>
        <div class="tRes" id="tRes" style="display:none"></div>
        <div class="mA">
          <button class="btnS" data-action="test-api">测试连接</button>
          <button class="btnP" data-action="save-settings">保存设置</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ========== STORAGE ==========
const S = {
  get(k, d) { try { const v = localStorage.getItem('m_' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('m_' + k, JSON.stringify(v)); } catch(e) { console.warn('Storage err', e); } }
};

// ========== MEMORY ==========
class Memory {
  constructor() {
    this.profile = S.get('profile', { name:null, interests:[], traits:[], facts:[], preferences:[], goals:[] });
    this.summaries = S.get('summaries', []);
    this.messages = S.get('messages', []);
    this.cfg = S.get('mcfg', { ctxWindow:12, summarizeAt:16 });
  }
  save() { S.set('profile', this.profile); S.set('summaries', this.summaries); S.set('messages', this.messages); }

  addMsg(role, content, extra) {
    this.messages.push({ role, content, ts: Date.now(), ...(extra||{}) });
    this.save();
  }
  removeMsgs(tsSet) {
    this.messages = this.messages.filter(m => !tsSet.has(m.ts));
    this.save();
  }
  needsSummary() {
    return this.messages.filter(m => !m.proactive && m.role !== 'system').length >= this.cfg.summarizeAt;
  }
  getBatch() {
    return this.messages.filter(m => !m.proactive && m.role !== 'system').slice(0, this.cfg.summarizeAt);
  }
  addSummary(data) {
    this.summaries.push({ ...data, ts: Date.now() });
    if (this.summaries.length > 50) this.summaries = this.summaries.slice(-50);
    this.save();
  }
  updateProfile(u) {
    if (!u) return;
    const merge = (a, b) => {
      const set = new Set((a||[]).map(s=>s.toLowerCase()));
      for (const i of (b||[])) { if (i && !set.has(i.toLowerCase())) { a.push(i); set.add(i.toLowerCase()); } }
      return a.slice(0, 50);
    };
    if (u.name && !this.profile.name) this.profile.name = u.name;
    this.profile.interests = merge(this.profile.interests, u.interests);
    this.profile.traits = merge(this.profile.traits, u.traits);
    this.profile.facts = merge(this.profile.facts, u.facts);
    this.profile.preferences = merge(this.profile.preferences, u.preferences);
    this.profile.goals = merge(this.profile.goals, u.goals);
    this.save();
  }
  fmtProfile() {
    const p = this.profile, l = [];
    if (p.name) l.push('姓名: ' + p.name);
    if (p.interests.length) l.push('兴趣: ' + p.interests.join('、'));
    if (p.traits.length) l.push('性格: ' + p.traits.join('、'));
    if (p.facts.length) l.push('已知:\n' + p.facts.map(f=>'- '+f).join('\n'));
    if (p.preferences.length) l.push('偏好: ' + p.preferences.join('、'));
    if (p.goals.length) l.push('目标: ' + p.goals.join('、'));
    return l.length ? l.join('\n') : '（尚无了解）';
  }
  fmtSummaries(n=5) {
    const r = this.summaries.slice(-n);
    if (!r.length) return '（暂无摘要）';
    return r.map(s => {
      const d = new Date(s.ts).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
      return `[${d}] ${s.summary}${s.topics?.length?' | '+s.topics.join(', '):''}`;
    }).join('\n\n');
  }
  recent() { return this.messages.slice(-(this.cfg.ctxWindow)); }
  stats() {
    const p = this.profile;
    const items = p.interests.length+p.traits.length+p.facts.length+p.preferences.length+p.goals.length;
    return { msgs: this.messages.length, sums: this.summaries.length, items, saved: this.summaries.length * 800 };
  }
  clear() {
    this.profile = {name:null,interests:[],traits:[],facts:[],preferences:[],goals:[]};
    this.summaries = []; this.messages = []; this.save();
  }
  export() { return JSON.stringify({profile:this.profile,summaries:this.summaries,messages:this.messages},null,2); }
  import(j) { try { const d=JSON.parse(j); if(d.profile) this.profile=d.profile; if(d.summaries) this.summaries=d.summaries; if(d.messages) this.messages=d.messages; this.save(); return true; } catch { return false; } }
}

// ========== LLM ==========
class LLM {
  constructor() { this.cfg = S.get('api', {url:'',key:'',model:''}); this.busy = false; }
  ok() { return !!(this.cfg.url && this.cfg.key && this.cfg.model); }
  update(c) { this.cfg = c; S.set('api', c); }

  async chat(messages, signal) {
    if (!this.ok()) throw new Error('API 未配置');
    const r = await fetch(this.cfg.url, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization': 'Bearer '+this.cfg.key },
      body: JSON.stringify({ model:this.cfg.model, messages, stream:false, max_tokens:1024 }),
      signal
    });
    if (!r.ok) throw new Error('API 错误 ' + r.status + ': ' + (await r.text().catch(()=>'')).slice(0,200));
    const d = await r.json();
    return d.choices?.[0]?.message?.content || '';
  }

  async stream(messages, onChunk, signal) {
    if (!this.ok()) throw new Error('API 未配置');
    const r = await fetch(this.cfg.url, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization': 'Bearer '+this.cfg.key },
      body: JSON.stringify({ model:this.cfg.model, messages, stream:true, max_tokens:2048 }),
      signal
    });
    if (!r.ok) throw new Error('API 错误 ' + r.status + ': ' + (await r.text().catch(()=>'')).slice(0,200));
    const reader = r.body.getReader(), dec = new TextDecoder();
    let full = '', buf = '';
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n'); buf = lines.pop() || '';
      for (const ln of lines) {
        const t = ln.trim(); if (!t || !t.startsWith('data:')) continue;
        const p = t.slice(5).trim(); if (p === '[DONE]') break;
        try { const d = JSON.parse(p); const c = d.choices?.[0]?.delta?.content || ''; if(c){full+=c;onChunk(c,full);} } catch{}
      }
    }
    return full;
  }

  async test() {
    const r = await fetch(this.cfg.url, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+this.cfg.key},
      body:JSON.stringify({model:this.cfg.model,messages:[{role:'user',content:'ping'}],max_tokens:5})
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return true;
  }
}

// ========== PROACTIVE ==========
class Proactive {
  constructor(mem, llm, onMsg) {
    this.mem=mem; this.llm=llm; this.onMsg=onMsg;
    this.cfg=S.get('pro',{enabled:false,interval:30});
    this.timer=null; this.last=0;
  }
  update(c){ this.cfg=c; S.set('pro',c); if(c.enabled) this.start(); else this.stop(); }
  start(){
    this.stop();
    if(!this.cfg.enabled||!this.llm.ok()) return;
    this.timer=setInterval(()=>this.fire(), this.cfg.interval*60000);
  }
  stop(){ if(this.timer){clearInterval(this.timer);this.timer=null;} }
  async fire(){
    if(this.llm.busy||!this.llm.ok()||!this.mem.messages.length) return;
    if(Date.now()-this.last<300000) return;
    this.last=Date.now();
    try{
      this.llm.busy=true;
      const sys=`你是用户的AI伙伴。给用户发一条自然的主动消息。

关于用户：${this.mem.fmtProfile()}
最近摘要：${this.mem.fmtSummaries(3)}
当前时间：${new Date().toLocaleString('zh-CN',{weekday:'long',hour:'2-digit',minute:'2-digit'})}

要求：像老朋友一样自然，2-4句话，简短温暖。直接说内容，不要加引号。根据时间调整问候。`;
      const r=await this.llm.chat([{role:'system',content:sys},{role:'user',content:'（请发送一条主动消息）'}]);
      if(r){this.mem.addMsg('assistant',r,{proactive:true});this.onMsg({role:'assistant',content:r,proactive:true,ts:Date.now()});
        if(document.hidden&&'Notification' in window&&Notification.permission==='granted') new Notification('Memoria',{body:r.slice(0,100)});
      }
    }catch(e){console.warn('[Proactive]',e.message)}
    finally{this.llm.busy=false;}
  }
}

// ========== APP ==========
class App {
  constructor() {
    this.mem = new Memory();
    this.llm = new LLM();
    this.pro = new Proactive(this.mem, this.llm, m => this.showProMsg(m));
    this.abort = null;

    // DOM refs
    this.$chat = document.getElementById('chat');
    this.$chatIn = document.getElementById('chatIn');
    this.$welcome = document.getElementById('welcome');
    this.$inp = document.getElementById('inp');
    this.$send = document.getElementById('send');
    this.$memOv = document.getElementById('memOv');
    this.$memPnl = document.getElementById('memPnl');
    this.$memBody = document.getElementById('memBody');
    this.$setModal = document.getElementById('setModal');
    this.$tglPro = document.getElementById('tglPro');
    this.$tRes = document.getElementById('tRes');
    this.$mSt = document.getElementById('mSt');
    this.$pSt = document.getElementById('pSt');

    this._bind();
    this._restoreSettings();
    this._renderChat();
    this._updateStatus();

    if (this.pro.cfg.enabled) this.pro.start();

    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  }

  // ===== EVENT BINDING =====
  _bind() {
    // All click actions via data-action delegation
    document.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const a = btn.dataset.action;
      switch (a) {
        case 'open-settings':  this._openSettings(); break;
        case 'close-settings': this._closeSettings(); break;
        case 'open-memory':    this._openMemory(); break;
        case 'close-memory':   this._closeMemory(); break;
        case 'toggle-proactive': this.$tglPro.classList.toggle('on'); break;
        case 'test-api':       this._testApi(btn); break;
        case 'save-settings':  this._saveSettings(); break;
        case 'export':         this._doExport(); break;
        case 'clear-memory':   this._doClear(); break;
      }
    });

    // Overlay clicks
    this.$memOv.addEventListener('click', () => this._closeMemory());
    this.$setModal.querySelector('.modalBg').addEventListener('click', () => this._closeSettings());

    // Input
    this.$inp.addEventListener('input', () => {
      this.$inp.style.height = 'auto';
      this.$inp.style.height = Math.min(this.$inp.scrollHeight, 150) + 'px';
      this.$send.disabled = !this.$inp.value.trim() || this.llm.busy;
    });
    this.$inp.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this._send(); }
    });
    this.$send.addEventListener('click', () => this._send());

    // Import file (needs special handling)
    this.$memBody.addEventListener('change', e => {
      if (e.target.id === 'importFile') this._doImport(e.target);
    });
  }

  // ===== SEND =====
  async _send() {
    const text = this.$inp.value.trim();
    if (!text || this.llm.busy) return;
    if (!this.llm.ok()) { this._toast('请先配置 API 设置'); this._openSettings(); return; }

    this.$inp.value = '';
    this.$inp.style.height = 'auto';
    this.$send.disabled = true;
    this.$welcome.style.display = 'none';

    this.mem.addMsg('user', text);
    this._appendMsg({role:'user', content:text, ts:Date.now()});

    const ctx = this._buildCtx();
    const el = this._placeholder();
    this.llm.busy = true;

    try {
      this.abort = new AbortController();
      let full = '';
      const result = await this.llm.stream(ctx, (c, a) => { full = a; this._updateBubble(el, a); }, this.abort.signal);
      this.mem.addMsg('assistant', result);
      this._finalize(el, result);
      await this._maybeSummarize();
    } catch (e) {
      this._finalize(el, e.name === 'AbortError' ? '(已取消)' : '⚠ ' + e.message);
    } finally {
      this.llm.busy = false;
      this.abort = null;
      this.$send.disabled = !this.$inp.value.trim();
      this._updateStatus();
    }
  }

  _buildCtx() {
    const msgs = [{
      role: 'system',
      content: `你是 Memoria，有长期记忆的AI伙伴，像老朋友一样自然温暖。

关于用户：
${this.mem.fmtProfile()}

过去的摘要：
${this.mem.fmtSummaries(4)}

规则：自然地引用对用户的了解，简洁有深度，像朋友聊天。不说"作为AI"。`
    }];
    for (const m of this.mem.recent()) {
      if (m.role === 'user' || m.role === 'assistant') msgs.push({role:m.role, content:m.content});
    }
    return msgs;
  }

  // ===== SUMMARIZE =====
  async _maybeSummarize() {
    if (!this.mem.needsSummary()) return;
    const batch = this.mem.getBatch();
    if (!batch.length) return;

    const ind = this._sumIndicator();
    try {
      const txt = batch.map(m => (m.role==='user'?'用户':'AI') + ': ' + m.content).join('\n');
      const profile = JSON.stringify(this.mem.profile);
      const r = await this.llm.chat([
        {role:'system',content:'你是记忆管理系统。分析对话，返回JSON。只输出JSON。'},
        {role:'user',content:`分析对话，返回JSON：
{"summary":"摘要150字内","topics":["话题"],"user_updates":{"name":null,"interests":[],"traits":[],"facts":[],"preferences":[],"goals":[]},"mood":"氛围"}
当前画像：${profile}
对话：${txt}`}
      ]);
      let p;
      try { p = JSON.parse(r.replace(/```json?\s*/g,'').replace(/```/g,'').trim()); }
      catch { p = {summary:r.slice(0,200),topics:[],user_updates:{}}; }
      this.mem.addSummary({summary:p.summary,topics:p.topics||[],mood:p.mood||''});
      this.mem.updateProfile(p.user_updates);
      this.mem.removeMsgs(new Set(batch.map(m=>m.ts)));
    } catch(e) { console.warn('[Summarize]',e.message); }
    finally { ind.remove(); }
  }

  // ===== MESSAGE RENDER =====
  _appendMsg(msg, anim=true) {
    const el = document.createElement('div');
    el.className = 'msg ' + (msg.role==='user'?'user':msg.proactive?'pro':'ai');
    if (!anim) el.style.animation = 'none';
    const t = new Date(msg.ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    el.innerHTML = `<div class="msgC"><div class="bub">${this._esc(msg.content)}</div><div class="meta">${msg.proactive?'<span class="tag">主动消息</span>':''}<span>${t}</span></div></div>`;
    this.$chatIn.appendChild(el);
    this._scroll();
  }

  placeholder() {
    const el = document.createElement('div');
    el.className = 'msg ai';
    el.innerHTML = `<div class="msgC"><div class="bub"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
    this.$chatIn.appendChild(el);
    this._scroll();
    return el;
  }
  // Alias for cleaner code
  get _placeholder() { return this.placeholder; }

  _updateBubble(el, txt) {
    el.querySelector('.bub').innerHTML = this._fmt(txt);
    this._scroll();
  }

  _finalize(el, txt) {
    const bub = el.querySelector('.bub');
    bub.innerHTML = this._fmt(txt);
    const c = el.querySelector('.msgC');
    const t = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    c.innerHTML += `<div class="meta"><span>${t}</span></div>`;
    this._scroll();
  }

  _sumIndicator() {
    const el = document.createElement('div');
    el.className = 'sumInd';
    el.innerHTML = '🧠 正在整理记忆...<span class="d"><span>.</span><span>.</span><span>.</span></span>';
    this.$chatIn.appendChild(el);
    this._scroll();
    return el;
  }

  showProMsg(msg) {
    this.$welcome.style.display = 'none';
    this._appendMsg(msg);
    this._updateStatus();
  }

  _renderChat() {
    if (this.mem.messages.length > 0) {
      this.$welcome.style.display = 'none';
      for (const m of this.mem.messages) this._appendMsg(m, false);
    }
  }

  // ===== PANELS =====
  _openMemory() {
    this.$memPnl.classList.add('show');
    this.$memOv.classList.add('show');
    this._renderPanel();
  }
  _closeMemory() {
    this.$memPnl.classList.remove('show');
    this.$memOv.classList.remove('show');
  }

  _openSettings() {
    this._restoreSettings();
    this.$setModal.classList.add('show');
  }
  _closeSettings() {
    this.$setModal.classList.remove('show');
    this.$tRes.style.display = 'none';
  }

  _restoreSettings() {
    document.getElementById('sUrl').value = this.llm.cfg.url || '';
    document.getElementById('sKey').value = this.llm.cfg.key || '';
    document.getElementById('sModel').value = this.llm.cfg.model || '';
    document.getElementById('sCtx').value = this.mem.cfg.ctxWindow || 12;
    document.getElementById('sThr').value = this.mem.cfg.summarizeAt || 16;
    document.getElementById('sInt').value = this.pro.cfg.interval || 30;
    this.$tglPro.classList.toggle('on', !!this.pro.cfg.enabled);
  }

  async _testApi(btn) {
    btn.disabled = true; btn.textContent = '测试中...';
    this.$tRes.style.display = 'none';
    const orig = {...this.llm.cfg};
    this.llm.update({
      url: document.getElementById('sUrl').value.trim(),
      key: document.getElementById('sKey').value.trim(),
      model: document.getElementById('sModel').value.trim()
    });
    try {
      await this.llm.test();
      this.$tRes.className = 'tRes ok'; this.$tRes.textContent = '✓ 连接成功'; this.$tRes.style.display = 'block';
    } catch(e) {
      this.$tRes.className = 'tRes er'; this.$tRes.textContent = '✗ ' + e.message; this.$tRes.style.display = 'block';
      this.llm.update(orig);
    } finally { btn.disabled = false; btn.textContent = '测试连接'; }
  }

  _saveSettings() {
    this.llm.update({
      url: document.getElementById('sUrl').value.trim(),
      key: document.getElementById('sKey').value.trim(),
      model: document.getElementById('sModel').value.trim()
    });
    this.mem.cfg.ctxWindow = parseInt(document.getElementById('sCtx').value) || 12;
    this.mem.cfg.summarizeAt = parseInt(document.getElementById('sThr').value) || 16;
    S.set('mcfg', this.mem.cfg);
    this.pro.update({
      enabled: this.$tglPro.classList.contains('on'),
      interval: parseInt(document.getElementById('sInt').value) || 30
    });
    this._updateStatus();
    this._closeSettings();
    this._toast('设置已保存', 'ok');
  }

  // ===== MEMORY PANEL RENDER =====
  _renderPanel() {
    const p = this.mem.profile;
    const st = this.mem.stats();
    let h = '';

    h += '<div class="st">用户画像</div><div class="pCard">';
    h += this._pf('姓名', p.name);
    h += this._ptags('兴趣', p.interests);
    h += this._ptags('性格', p.traits);
    h += this._ptags('偏好', p.preferences);
    h += this._ptags('目标', p.goals);
    if (p.facts.length) h += `<div class="pf"><span class="pl">已知事实</span><div class="pv">${p.facts.map(f=>'· '+this._esc(f)).join('<br>')}</div></div>`;
    h += '</div>';

    h += `<div class="st">对话摘要 (${this.mem.summaries.length})</div>`;
    if (this.mem.summaries.length) {
      h += '<div class="sList">';
      for (const s of [...this.mem.summaries].reverse().slice(0,15)) {
        const d = new Date(s.ts).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
        h += `<div class="sItem"><div class="sDate">${d}</div><div class="sText">${this._esc(s.summary)}</div>`;
        if (s.topics?.length) h += `<div class="sTopics">${s.topics.map(t=>`<span class="sTopic">${this._esc(t)}</span>`).join('')}</div>`;
        h += '</div>';
      }
      h += '</div>';
    } else h += '<div style="color:var(--textM);font-size:.82rem;font-style:italic">暂无摘要，聊天达到阈值后自动生成</div>';

    h += `<div class="st">统计</div><div class="stats">
      <div class="statC"><div class="statN">${st.msgs}</div><div class="statL">当前消息</div></div>
      <div class="statC"><div class="statN">${st.sums}</div><div class="statL">对话摘要</div></div>
      <div class="statC"><div class="statN">${st.items}</div><div class="statL">画像条目</div></div>
      <div class="statC"><div class="statN">~${Math.round(st.saved/1000)}k</div><div class="statL">节省tokens</div></div>
    </div>`;

    h += `<div class="pnlBtns">
      <button class="btnO" data-action="export">导出记忆数据</button>
      <label class="btnO" style="cursor:pointer">导入记忆数据<input type="file" accept=".json" id="importFile" style="display:none"></label>
      <button class="btnO dng" data-action="clear-memory">清除所有记忆</button>
    </div>`;

    this.$memBody.innerHTML = h;
  }

  _pf(l, v) {
    return `<div class="pf"><span class="pl">${l}</span><div class="pv${v?'':' empty'}">${v?this._esc(v):'未知'}</div></div>`;
  }
  _ptags(l, items) {
    if (!items?.length) return `<div class="pf"><span class="pl">${l}</span><div class="pv empty">暂无</div></div>`;
    return `<div class="pf"><span class="pl">${l}</span><div class="ptags">${items.map(t=>`<span class="ptag">${this._esc(t)}</span>`).join('')}</div></div>`;
  }

  // ===== ACTIONS =====
  _doExport() {
    const b = new Blob([this.mem.export()], {type:'application/json'});
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = u; a.download = `memoria-${new Date().toISOString().slice(0,10)}.json`; a.click();
    URL.revokeObjectURL(u);
  }
  _doImport(inp) {
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { if(this.mem.import(r.result)){this._toast('导入成功，页面将刷新','ok');setTimeout(()=>location.reload(),1000);} else this._toast('导入失败'); };
    r.readAsText(f);
  }
  _doClear() {
    if (!confirm('确定要清除所有记忆吗？此操作不可恢复。')) return;
    this.mem.clear();
    this.$chatIn.innerHTML = '';
    this.$chatIn.appendChild(this.$welcome);
    this.$welcome.style.display = '';
    this._renderPanel();
    this._updateStatus();
  }

  // ===== STATUS =====
  _updateStatus() {
    const s = this.mem.stats();
    const on = s.msgs > 0 || s.sums > 0;
    this.$mSt.innerHTML = `<span class="dot ${on?'on':'off'}"></span>记忆: ${s.msgs}条消息 · ${s.sums}段摘要`;
    const pon = this.pro.cfg.enabled;
    this.$pSt.innerHTML = `<span class="dot ${pon?'on':'off'}"></span>主动消息: ${pon?'每'+this.pro.cfg.interval+'分钟':'关闭'}`;
  }

  // ===== HELPERS =====
  _esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  _fmt(t) {
    return this._esc(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`(.*?)`/g,'<code style="background:var(--surface2);padding:1px 5px;border-radius:3px;font-family:var(--fm);font-size:.85em">$1</code>');
  }
  _scroll() { requestAnimationFrame(()=>{ this.$chat.scrollTop = this.$chat.scrollHeight; }); }
  _toast(msg, type) {
    const el = document.createElement('div');
    el.className = 'toast';
    if (type === 'ok') el.style.background = 'var(--ok)';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
}
